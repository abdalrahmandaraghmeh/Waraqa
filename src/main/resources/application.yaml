spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/waraqa_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password123}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET:mySuperSecretKeyForJwtAuthenticationThatIsAtLeast32BytesLong}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}
